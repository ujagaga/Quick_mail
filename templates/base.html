<!-- templates/base.html -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quick Mail</title>
    <link rel="stylesheet" type="text/css" href="/static/base.css">
    <link rel="stylesheet" href="/static/css/fontawesome.min.css">
    <link rel="stylesheet" href="/static/css/solid.min.css">
    <link rel="icon" href="/static/favicon.ico">
</head>

<body>
    <section class="hero is-primary is-fullheight">

        <div class="hero-head">
            <nav class="navbar">
                <div class="container">
                    <div id="navbarMenuHeroA" class="navbar-menu">
                        {% if request.endpoint != 'home' %}
                        <a href="/" class="navbar-item" title="Home"><i class="fa-solid fa-house"></i></a>
                        {% endif %}
                        {% if authorized %}
                        {% if user.status == 'admin' and request.endpoint != 'admin' %}
                        <a href="/admin" class="navbar-item" title="Users"><i class="fa-solid fa-user"></i></a>
                        {% endif %}
                        <a href="/logout" class="navbar-item" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></a>
                        {% else %}
                        {% if request.endpoint != 'login' %}
                        <a href="/login" class="navbar-item" title="Log in"><i class="fa-solid fa-right-to-bracket"></i></a>
                        {% endif %}
                        {% endif %}
                    </div>
                </div>
            </nav>
        </div>

        <div class="hero-body">
            <div class="container has-text-centered">
               {% block content %}
               {% endblock %}
            </div>
        </div>
    </section>
</body>

</html>
