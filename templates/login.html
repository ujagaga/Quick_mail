{% extends "base.html" %}

{% block content %}
<div class="limited">

    <h3 class="title">Login</h3>

    <div class="box">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="notification is-danger">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}

        <a class="full-width" href="/authorize?next_url={{next_url}}">Sign in with Google</a>
    </div>
</div>
{% endblock %}
